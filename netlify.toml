[build]
  # Build happens in GitHub Actions, not Netlify (saves build minutes)
  command = "echo 'Build handled by GitHub Actions'"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Neon Auth through our own domain (T-0493, Nov 12 2026, same fix as
# Foreground T-0492). Called directly, its session cookie is a cross-site
# cookie on the neonauth host: Safari before 26.2 (and any browser that blocks
# third-party cookies without honouring "Partitioned") drops it, so sign-up
# and sign-in silently failed there. Through this rewrite the cookie is
# first-party for happyroam.travel (Better Auth's recommended fix for Safari).
# Neon answers with Cache-Control: no-store, so the CDN keeps nothing. Must
# stay above the SPA catch-all. The app also mints its API token here
# (/neon-auth/token, src/lib/authToken.ts); the JWT issuer stays Neon's own
# origin, which netlify/functions/lib/auth.mts checks (T-0555).
[[redirects]]
  from = "/neon-auth/*"
  to = "https://ep-royal-art-abpqmm55.neonauth.eu-west-2.aws.neon.tech/neondb/auth/:splat"
  status = 200
  force = true

# API routes to functions - explicit mappings for multi-path functions
# Heritage (has sub-paths)
[[redirects]]
  from = "/api/heritage/regions"
  to = "/.netlify/functions/heritage"
  status = 200
  force = true

[[redirects]]
  from = "/api/heritage/eras"
  to = "/.netlify/functions/heritage"
  status = 200
  force = true

[[redirects]]
  from = "/api/heritage/*"
  to = "/.netlify/functions/heritage"
  status = 200
  force = true

[[redirects]]
  from = "/api/heritage"
  to = "/.netlify/functions/heritage"
  status = 200
  force = true

# Festivals (has sub-paths)
[[redirects]]
  from = "/api/festivals/upcoming"
  to = "/.netlify/functions/festivals"
  status = 200
  force = true

[[redirects]]
  from = "/api/festivals/*"
  to = "/.netlify/functions/festivals"
  status = 200
  force = true

[[redirects]]
  from = "/api/festivals"
  to = "/.netlify/functions/festivals"
  status = 200
  force = true

# User (has sub-paths for CRUD)
[[redirects]]
  from = "/api/user/*"
  to = "/.netlify/functions/user"
  status = 200
  force = true

[[redirects]]
  from = "/api/user"
  to = "/.netlify/functions/user"
  status = 200
  force = true

# Attractions (has query params but single path)
[[redirects]]
  from = "/api/attractions/*"
  to = "/.netlify/functions/attractions"
  status = 200
  force = true

[[redirects]]
  from = "/api/attractions"
  to = "/.netlify/functions/attractions"
  status = 200
  force = true

# Guides (has sub-paths for slugs and categories)
[[redirects]]
  from = "/api/guides/categories"
  to = "/.netlify/functions/guides"
  status = 200
  force = true

[[redirects]]
  from = "/api/guides/*"
  to = "/.netlify/functions/guides"
  status = 200
  force = true

[[redirects]]
  from = "/api/guides"
  to = "/.netlify/functions/guides"
  status = 200
  force = true

# Stripe webhook: the endpoint registered in Stripe is /api/webhook/stripe, but the
# catch-all below would send it to a function named "webhook/stripe" (a 404), so Stripe
# events never reached webhook-stripe.mts and Pro buyers were never marked Pro.
# A rewrite (status 200) passes method, headers and raw body unchanged, so the
# stripe-signature check still works.
[[redirects]]
  from = "/api/webhook/stripe"
  to = "/.netlify/functions/webhook-stripe"
  status = 200
  force = true

# Catch-all for other API routes (simple single-path functions)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Static assets - serve directly (must be before SPA fallback)
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# Sitemap (dynamic from function)
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# Robots.txt
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# Agoda partner verification
[[redirects]]
  from = "/AgodaPartnerVerification.html"
  to = "/AgodaPartnerVerification.html"
  status = 200

# SPA redirect - all other routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
# Promoten (archived affiliate tracker) removed Nov 11 2026: no t.js script, no promoten.pro
# in the CSP. subscription.mts still passes a legacy plugaff_ref cookie to Stripe (now empty).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://*.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.stripe.com https://*.neon.tech https://api.anthropic.com https://*.google-analytics.com https://*.googletagmanager.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Dev server settings
[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3000
  autoLaunch = false
