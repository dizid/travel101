<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <title>HappyRoam</title>
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#fav-bg)"/>

  <!-- H letterform — scaled to 32×32 viewport -->
  <rect x="4" y="7"  width="3"  height="18" rx="0.8" fill="#1c1917"/>
  <rect x="13" y="7" width="3"  height="18" rx="0.8" fill="#1c1917"/>
  <rect x="4"  y="14" width="12" height="3" rx="0.8" fill="#1c1917"/>

  <!-- R letterform -->
  <rect x="18" y="7" width="3" height="18" rx="0.8" fill="#1c1917"/>
  <!-- R bowl filled -->
  <path d="M21 7 Q28.5 7 28.5 12 Q28.5 17 21 17 L21 7 Z" fill="#1c1917"/>
  <!-- R bowl counter cutout -->
  <ellipse cx="25" cy="12" rx="3" ry="4.5" fill="url(#fav-bg)"/>
  <!-- R leg -->
  <path d="M21 17 L27 25" stroke="#1c1917" stroke-width="3" stroke-linecap="round"/>
</svg>
