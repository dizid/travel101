name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (vite-ssg prerender)
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VITE_NEON_AUTH_URL: ${{ secrets.VITE_NEON_AUTH_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_KLOOK_AFFILIATE_ID: ${{ secrets.VITE_KLOOK_AFFILIATE_ID }}
          VITE_AGODA_AFFILIATE_ID: ${{ secrets.VITE_AGODA_AFFILIATE_ID }}
          VITE_12GO_AFFILIATE_ID: ${{ secrets.VITE_12GO_AFFILIATE_ID }}
          VITE_GETYOURGUIDE_AFFILIATE_ID: ${{ secrets.VITE_GETYOURGUIDE_AFFILIATE_ID }}
          VITE_SAFETYWING_AFFILIATE_ID: ${{ secrets.VITE_SAFETYWING_AFFILIATE_ID }}

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --dir=dist --prod --functions=netlify/functions
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
