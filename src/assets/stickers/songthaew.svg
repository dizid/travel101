<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <title>Songthaew</title>
  <!-- Truck cab -->
  <rect x="110" y="70" width="62" height="72" rx="10" fill="#fef3c7" stroke="#1c1917" stroke-width="5"/>
  <!-- Cab window -->
  <rect x="118" y="78" width="46" height="30" rx="6" fill="#dbeafe" stroke="#1c1917" stroke-width="3"/>
  <!-- Truck bed / bench seating area -->
  <rect x="28" y="78" width="88" height="64" rx="6" fill="#f59e0b" stroke="#1c1917" stroke-width="5" stroke-linejoin="round"/>
  <!-- Roof over bed -->
  <rect x="22" y="62" width="96" height="18" rx="6" fill="#fbbf24" stroke="#1c1917" stroke-width="4"/>
  <!-- Bench seats -->
  <rect x="36" y="96" width="72" height="14" rx="4" fill="#fef3c7" stroke="#1c1917" stroke-width="2.5"/>
  <rect x="36" y="118" width="72" height="14" rx="4" fill="#fef3c7" stroke="#1c1917" stroke-width="2.5"/>
  <!-- Open back -->
  <line x1="28" y1="78" x2="28" y2="142" stroke="#1c1917" stroke-width="5" stroke-linecap="round"/>
  <!-- Wheels -->
  <circle cx="60"  cy="156" r="22" fill="#1c1917"/>
  <circle cx="60"  cy="156" r="12" fill="#fef3c7"/>
  <circle cx="60"  cy="156" r="5"  fill="#1c1917"/>
  <circle cx="148" cy="156" r="22" fill="#1c1917"/>
  <circle cx="148" cy="156" r="12" fill="#fef3c7"/>
  <circle cx="148" cy="156" r="5"  fill="#1c1917"/>
  <!-- Step bar -->
  <rect x="20" y="138" width="14" height="6" rx="3" fill="#1c1917"/>
  <!-- Headlight -->
  <rect x="168" y="90" width="10" height="16" rx="4" fill="#fde68a" stroke="#1c1917" stroke-width="2"/>
</svg>
