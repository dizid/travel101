<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488"/>
      <stop offset="50%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative pattern -->
  <g opacity="0.1">
    <circle cx="100" cy="100" r="200" fill="white"/>
    <circle cx="1100" cy="530" r="250" fill="white"/>
    <circle cx="600" cy="-50" r="150" fill="white"/>
  </g>

  <!-- Main content area -->
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="white" fill-opacity="0.95"/>

  <!-- Logo icon -->
  <rect x="100" y="100" width="80" height="80" rx="20" fill="url(#goldGradient)"/>
  <text x="140" y="155" font-size="40" text-anchor="middle" fill="white">🌴</text>

  <!-- Title -->
  <text x="200" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="bold" fill="#111827">Smart Traveler Thailand</text>

  <!-- Tagline -->
  <text x="100" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#6b7280">Your AI-powered guide to the Land of Smiles</text>

  <!-- Feature cards -->
  <g>
    <!-- Card 1: Visa Guide -->
    <rect x="100" y="270" width="300" height="120" rx="16" fill="#fef3c7"/>
    <text x="140" y="320" font-size="36">🛂</text>
    <text x="180" y="325" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#92400e">Visa Guide</text>
    <text x="140" y="365" font-family="system-ui, sans-serif" font-size="16" fill="#a16207">90-day tourist visas explained</text>

    <!-- Card 2: 400+ Places -->
    <rect x="420" y="270" width="300" height="120" rx="16" fill="#d1fae5"/>
    <text x="460" y="320" font-size="36">🗺️</text>
    <text x="500" y="325" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#065f46">400+ Places</text>
    <text x="460" y="365" font-family="system-ui, sans-serif" font-size="16" fill="#047857">Hidden gems & local secrets</text>

    <!-- Card 3: AI Advisor -->
    <rect x="740" y="270" width="300" height="120" rx="16" fill="#e0e7ff"/>
    <text x="780" y="320" font-size="36">🤖</text>
    <text x="820" y="325" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#3730a3">AI Advisor</text>
    <text x="780" y="365" font-family="system-ui, sans-serif" font-size="16" fill="#4f46e5">Personalized recommendations</text>
  </g>

  <!-- Bottom section -->
  <g>
    <!-- Thai greeting -->
    <text x="100" y="470" font-family="system-ui, sans-serif" font-size="24" fill="#0d9488" font-weight="500">สวัสดี • Sawasdee!</text>

    <!-- URL -->
    <text x="100" y="520" font-family="system-ui, sans-serif" font-size="20" fill="#9ca3af">happyroam.travel</text>

    <!-- CTA -->
    <rect x="860" y="440" width="240" height="60" rx="30" fill="url(#goldGradient)"/>
    <text x="980" y="480" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="white">Plan Your Trip →</text>
  </g>
</svg>
