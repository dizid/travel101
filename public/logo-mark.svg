<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>HappyRoam — HR monogram</title>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)"/>

  <!-- H letterform -->
  <rect x="10" y="16" width="6" height="32" rx="1.5" fill="#1c1917"/>
  <rect x="27" y="16" width="6" height="32" rx="1.5" fill="#1c1917"/>
  <rect x="10" y="28" width="23" height="5" rx="1.5" fill="#1c1917"/>

  <!-- R letterform — right half -->
  <rect x="37" y="16" width="6" height="32" rx="1.5" fill="#1c1917"/>
  <!-- R bowl — filled arc via compound path -->
  <path d="M43 16 Q56 16 56 25 Q56 34 43 34 L43 16 Z" fill="#1c1917"/>
  <!-- Bowl cutout to create the open counter -->
  <ellipse cx="49.5" cy="25" rx="5.5" ry="8" fill="url(#bg-grad)"/>
  <!-- R leg diagonal -->
  <path d="M43 34 L53 48" stroke="#1c1917" stroke-width="5.5" stroke-linecap="round"/>
</svg>
