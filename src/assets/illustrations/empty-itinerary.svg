<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <title>No itinerary yet — blank postcard</title>
  <!-- Postcard shadow -->
  <rect x="52" y="48" width="308" height="216" rx="10" fill="#e7e0d4"/>
  <!-- Postcard body — aged white paper -->
  <rect x="44" y="40" width="312" height="216" rx="10" fill="#fffbf5" stroke="#1c1917" stroke-width="3"/>
  <!-- Left half — image area (empty, warm tone) -->
  <rect x="52" y="50" width="148" height="136" rx="6" fill="#fde68a" stroke="#e7e0d4" stroke-width="1.5"/>
  <!-- Placeholder photo frame corners -->
  <path d="M60 50 L60 62 M60 50 L72 50" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <path d="M192 50 L192 62 M192 50 L180 50" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 186 L60 174 M60 186 L72 186" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <path d="M192 186 L192 174 M192 186 L180 186" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <!-- Horizon line in placeholder image -->
  <line x1="52" y1="130" x2="200" y2="130" stroke="#e7e0d4" stroke-width="1.5"/>
  <!-- Sky clouds (rough ellipses) -->
  <ellipse cx="90"  cy="90"  rx="28" ry="16" fill="#fffbf5" stroke="#e7e0d4" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="130" cy="82"  rx="22" ry="14" fill="#fffbf5" stroke="#e7e0d4" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="162" cy="95"  rx="18" ry="11" fill="#fffbf5" stroke="#e7e0d4" stroke-width="1.5" opacity="0.8"/>
  <!-- Ground / water below horizon -->
  <rect x="52" y="130" width="148" height="56" rx="0" fill="#ccfbf1" opacity="0.3"/>
  <!-- Divider line between image and writing area -->
  <line x1="208" y1="50" x2="208" y2="248" stroke="#e7e0d4" stroke-width="2"/>
  <!-- Stamp area top-right -->
  <rect x="304" y="54" width="44" height="54" rx="4" fill="#fef3c7" stroke="#1c1917" stroke-width="2"/>
  <!-- Perforated stamp edge -->
  <rect x="309" y="59" width="34" height="44" rx="2" fill="#fffbf5" stroke="#e7e0d4" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Temple silhouette in stamp -->
  <rect x="316" y="84" width="20" height="10" rx="1" fill="#f59e0b" opacity="0.7"/>
  <path d="M318 84 L326 72 L334 84 Z" fill="#f59e0b" opacity="0.7"/>
  <!-- "THAILAND" text on stamp -->
  <text x="312" y="80" font-family="Georgia, serif" font-size="6" fill="#b45309" letter-spacing="0.5" font-weight="700">THAILAND</text>
  <!-- Address lines (blank — empty itinerary) -->
  <line x1="218" y1="126" x2="340" y2="126" stroke="#e7e0d4" stroke-width="1.5"/>
  <line x1="218" y1="140" x2="340" y2="140" stroke="#e7e0d4" stroke-width="1.5"/>
  <line x1="218" y1="154" x2="310" y2="154" stroke="#e7e0d4" stroke-width="1.5"/>
  <!-- Message lines — empty -->
  <line x1="218" y1="176" x2="344" y2="176" stroke="#e7e0d4" stroke-width="1.5" stroke-dasharray="12 8"/>
  <line x1="218" y1="192" x2="344" y2="192" stroke="#e7e0d4" stroke-width="1.5" stroke-dasharray="12 8"/>
  <line x1="218" y1="208" x2="330" y2="208" stroke="#e7e0d4" stroke-width="1.5" stroke-dasharray="12 8"/>
  <line x1="218" y1="224" x2="344" y2="224" stroke="#e7e0d4" stroke-width="1.5" stroke-dasharray="12 8"/>
  <!-- Pen resting on postcard -->
  <rect x="70" y="210" width="100" height="8" rx="4" fill="#1c1917" transform="rotate(-10, 70, 214)"/>
  <rect x="66"  y="212" width="12" height="8" rx="4" fill="#f59e0b" transform="rotate(-10, 70, 214)"/>
  <path d="M158 204 L164 196" stroke="#1c1917" stroke-width="3" stroke-linecap="round" transform="rotate(-10, 70, 214)"/>
</svg>
