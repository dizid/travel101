<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <title>Longtail boat</title>
  <!-- Water ripples -->
  <path d="M20 168 Q50 158 80 168 Q110 178 140 168 Q170 158 190 168" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M10 180 Q50 168 90 180 Q130 192 170 180 Q185 176 195 180" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.3"/>
  <!-- Hull -->
  <path d="M25 155 Q30 115 50 110 L155 108 Q170 110 178 120 L175 155 Q130 168 80 168 Q50 168 25 155 Z" fill="#fef3c7" stroke="#1c1917" stroke-width="5" stroke-linejoin="round"/>
  <!-- Hull stripe -->
  <path d="M30 148 Q80 158 150 148 L162 135 L35 136 Z" fill="#f59e0b" stroke="#1c1917" stroke-width="2"/>
  <!-- Canopy frame -->
  <rect x="60" y="82" width="90" height="30" rx="6" fill="#fbbf24" stroke="#1c1917" stroke-width="4"/>
  <!-- Canopy poles -->
  <line x1="68"  y1="112" x2="68"  y2="136" stroke="#1c1917" stroke-width="4" stroke-linecap="round"/>
  <line x1="142" y1="112" x2="142" y2="136" stroke="#1c1917" stroke-width="4" stroke-linecap="round"/>
  <!-- Long tail engine arm -->
  <path d="M172 130 Q195 118 198 108 Q196 100 188 102 Q182 108 175 118" stroke="#1c1917" stroke-width="5" stroke-linecap="round"/>
  <!-- Propeller -->
  <ellipse cx="188" cy="103" rx="10" ry="5" fill="#1c1917" transform="rotate(-20, 188, 103)"/>
  <!-- Marigold garland -->
  <path d="M60 82 Q100 76 140 82" stroke="#f97316" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round" fill="none"/>
  <!-- Bow flag -->
  <line x1="50" y1="110" x2="44" y2="72" stroke="#1c1917" stroke-width="3" stroke-linecap="round"/>
  <path d="M44 72 L62 78 L44 85 Z" fill="#f59e0b" stroke="#1c1917" stroke-width="2"/>
</svg>
