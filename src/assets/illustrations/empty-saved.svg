<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <title>No saved places yet — travel journal</title>
  <!-- Page shadow -->
  <rect x="72" y="38" width="262" height="228" rx="6" fill="#e7e0d4"/>
  <!-- Journal cover -->
  <rect x="66" y="30" width="268" height="228" rx="8" fill="#92400e"/>
  <!-- Spine detail -->
  <rect x="66" y="30" width="24" height="228" rx="8" fill="#78350f"/>
  <line x1="90" y1="30" x2="90" y2="258" stroke="#5c2d0f" stroke-width="1.5"/>
  <!-- Page interior -->
  <rect x="90" y="30" width="244" height="228" rx="0" fill="#fffbf5"/>
  <rect x="98" y="38" width="228" height="212" rx="4" fill="#fffde7"/>
  <!-- Ruled lines -->
  <g stroke="#e7e0d4" stroke-width="1">
    <line x1="108" y1="90"  x2="316" y2="90"/>
    <line x1="108" y1="106" x2="316" y2="106"/>
    <line x1="108" y1="122" x2="316" y2="122"/>
    <line x1="108" y1="138" x2="316" y2="138"/>
    <line x1="108" y1="154" x2="316" y2="154"/>
    <line x1="108" y1="170" x2="316" y2="170"/>
    <line x1="108" y1="186" x2="316" y2="186"/>
    <line x1="108" y1="202" x2="316" y2="202"/>
    <line x1="108" y1="218" x2="316" y2="218"/>
  </g>
  <!-- Pressed flower — top right of page -->
  <!-- Stem -->
  <path d="M268 52 Q278 64 272 80 Q266 94 274 106" stroke="#4ade80" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Petals -->
  <ellipse cx="268" cy="52" rx="8"  ry="12" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5" transform="rotate(-15, 268, 52)"/>
  <ellipse cx="258" cy="58" rx="8"  ry="12" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5" transform="rotate(45, 258, 58)"/>
  <ellipse cx="276" cy="62" rx="8"  ry="12" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5" transform="rotate(-60, 276, 62)"/>
  <ellipse cx="264" cy="68" rx="8"  ry="12" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5" transform="rotate(80, 264, 68)"/>
  <!-- Flower center -->
  <circle cx="268" cy="60" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <!-- Small leaf -->
  <path d="M272 80 Q282 74 280 86 Q276 90 272 80 Z" fill="#4ade80" stroke="#16a34a" stroke-width="1.5"/>
  <!-- Handwritten title placeholder lines — empty state feel -->
  <rect x="108" y="54" width="100" height="4" rx="2" fill="#e7e0d4"/>
  <rect x="108" y="64" width="68"  height="3" rx="1.5" fill="#e7e0d4"/>
  <!-- Empty line dashes — no entries yet -->
  <g stroke="#d4c9b8" stroke-width="1.5" stroke-dasharray="12 8" stroke-linecap="round">
    <line x1="108" y1="99"  x2="316" y2="99"/>
    <line x1="108" y1="115" x2="260" y2="115"/>
    <line x1="108" y1="131" x2="316" y2="131"/>
    <line x1="108" y1="147" x2="240" y2="147"/>
  </g>
  <!-- Bookmark ribbon -->
  <rect x="296" y="30" width="12" height="52" rx="0" fill="#f59e0b"/>
  <path d="M296 80 L302 90 L308 80 Z" fill="#f59e0b"/>
</svg>
