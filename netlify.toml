[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# API routes to functions - explicit mappings for multi-path functions
# Heritage (has sub-paths)
[[redirects]]
  from = "/api/heritage/regions"
  to = "/.netlify/functions/heritage"
  status = 200
  force = true

[[redirects]]
  from = "/api/heritage/eras"
  to = "/.netlify/functions/heritage"
  status = 200
  force = true

[[redirects]]
  from = "/api/heritage/*"
  to = "/.netlify/functions/heritage"
  status = 200
  force = true

[[redirects]]
  from = "/api/heritage"
  to = "/.netlify/functions/heritage"
  status = 200
  force = true

# Festivals (has sub-paths)
[[redirects]]
  from = "/api/festivals/upcoming"
  to = "/.netlify/functions/festivals"
  status = 200
  force = true

[[redirects]]
  from = "/api/festivals/*"
  to = "/.netlify/functions/festivals"
  status = 200
  force = true

[[redirects]]
  from = "/api/festivals"
  to = "/.netlify/functions/festivals"
  status = 200
  force = true

# User (has sub-paths for CRUD)
[[redirects]]
  from = "/api/user/*"
  to = "/.netlify/functions/user"
  status = 200
  force = true

[[redirects]]
  from = "/api/user"
  to = "/.netlify/functions/user"
  status = 200
  force = true

# Attractions (has query params but single path)
[[redirects]]
  from = "/api/attractions/*"
  to = "/.netlify/functions/attractions"
  status = 200
  force = true

[[redirects]]
  from = "/api/attractions"
  to = "/.netlify/functions/attractions"
  status = 200
  force = true

# Catch-all for other API routes (simple single-path functions)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Static assets - serve directly (must be before SPA fallback)
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# Sitemap (dynamic from function)
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# Robots.txt
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# Agoda partner verification
[[redirects]]
  from = "/AgodaPartnerVerification.html"
  to = "/AgodaPartnerVerification.html"
  status = 200

# SPA redirect - all other routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://*.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.stripe.com https://*.neon.tech https://api.anthropic.com https://*.google-analytics.com https://*.googletagmanager.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Dev server settings
[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3000
  autoLaunch = false
