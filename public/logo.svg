<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <title>HappyRoam</title>
  <defs>
    <!-- HR monogram background — rounded square -->
    <clipPath id="mark-clip">
      <rect x="0" y="4" width="56" height="56" rx="12"/>
    </clipPath>
  </defs>

  <!-- ── HR Monogram mark ── -->
  <!-- Warm gold rounded square background -->
  <rect x="0" y="4" width="56" height="56" rx="12" fill="#f59e0b"/>
  <!-- Subtle inner depth -->
  <rect x="0" y="4" width="56" height="56" rx="12" fill="url(#mark-depth)" opacity="0.15"/>
  <defs>
    <linearGradient id="mark-depth" x1="0" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- H letterform — clean, weight 700 geometry -->
  <rect x="11" y="18" width="5" height="28" rx="1.5" fill="#1c1917"/>
  <rect x="25" y="18" width="5" height="28" rx="1.5" fill="#1c1917"/>
  <rect x="11" y="29" width="19" height="4.5" rx="1.5" fill="#1c1917"/>

  <!-- R letterform -->
  <rect x="33" y="18" width="5" height="28" rx="1.5" fill="#1c1917"/>
  <!-- R top bowl -->
  <path d="M38 18 Q50 18 50 25.5 Q50 33 38 33 L38 18Z" fill="#1c1917"/>
  <ellipse cx="44" cy="25.5" rx="6" ry="7.5" fill="#f59e0b"/>
  <!-- R leg -->
  <path d="M38 33 L46 46" stroke="#1c1917" stroke-width="5" stroke-linecap="round"/>

  <!-- ── "HappyRoam" wordmark ── -->
  <!-- Rendered as SVG text with Prompt 700; fallback to system-ui -->
  <text
    x="72"
    y="44"
    font-family="Prompt, 'Inter Tight', system-ui, sans-serif"
    font-size="32"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#1c1917"
  >HappyRoam</text>
</svg>
